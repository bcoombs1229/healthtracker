<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Workout Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide scrollbar for sleekness but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Smooth slide-up animation for the completion toast */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex justify-center">

    <main class="w-full max-w-md bg-slate-900 min-h-screen relative flex flex-col shadow-2xl overflow-hidden pb-24 overflow-y-auto no-scrollbar" id="app-container">
        
        <!-- ================= HOME VIEW ================= -->
        <div id="view-home" class="flex flex-col w-full transition-transform duration-300">
            <!-- Header -->
            <header class="pt-12 pb-6 px-6 bg-slate-900 sticky top-0 z-10">
                <div class="flex justify-between items-center">
                    <div>
                        <p id="current-date" class="text-slate-400 text-sm font-medium uppercase tracking-wider">Loading...</p>
                        <h1 class="text-3xl font-bold mt-1 text-white">Today's Plan</h1>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700">
                        <i class="fa-solid fa-user text-slate-300"></i>
                    </div>
                </div>
            </header>

            <div class="px-6 space-y-6">
                <!-- Metrics Card (Renpho) -->
                <section class="bg-slate-800 rounded-3xl p-6 border border-slate-700/50 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10">
                        <i class="fa-solid fa-weight-scale text-6xl"></i>
                    </div>
                    <div class="flex items-center space-x-2 mb-4">
                        <div class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-bolt text-emerald-400 text-sm"></i>
                        </div>
                        <h2 class="text-slate-300 font-semibold">Weight Trend</h2>
                    </div>
                    <div class="flex justify-between items-end mb-6">
                        <div>
                            <p class="text-4xl font-extrabold text-white"><span id="weight-val">--</span> <span class="text-lg text-slate-400 font-medium">lbs</span></p>
                        </div>
                        <div class="text-right">
                            <p class="text-slate-400 text-sm">Latest BMI</p>
                            <p class="text-xl font-bold text-slate-200" id="bmi-val">--</p>
                        </div>
                    </div>

                    <!-- Interactive Chart Container -->
                <div class="w-full h-24 mt-2">
                    <canvas id="weightChart"></canvas>
                </div>
            </section>

            <!-- Program Selector -->
            <section>
                <div class="flex justify-between items-end mb-3">
                    <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Select Program</h3>
                    <span class="text-xs text-blue-400 font-medium">4 Active</span>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-4" id="program-tiles">
                    <!-- Pushjerk Tile -->
                    <button id="tile-pushjerk" onclick="selectProgram('pushjerk')" class="relative p-4 rounded-2xl bg-slate-700 border-2 border-blue-500 flex flex-col items-start transition-all text-left shadow-lg shadow-blue-500/20 transform scale-[1.02]">
                        <div class="w-8 h-8 rounded-full bg-orange-500/20 flex items-center justify-center mb-2">
                            <i class="fa-solid fa-dumbbell text-orange-400 text-sm"></i>
                        </div>
                        <span class="text-white font-bold">Pushjerk</span>
                        <span class="text-slate-400 text-xs mt-1">CrossFit WOD</span>
                    </button>
                    <!-- BODi Tile -->
                    <button id="tile-bodi" onclick="selectProgram('bodi')" class="relative p-4 rounded-2xl bg-slate-800 border-2 border-slate-700/50 flex flex-col items-start transition-all text-left opacity-60 hover:opacity-100">
                        <div class="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center mb-2">
                            <i class="fa-solid fa-tv text-indigo-400 text-sm"></i>
                        </div>
                        <span class="text-white font-bold">BODi</span>
                        <span class="text-slate-400 text-xs mt-1">P90X • Day 15</span>
                    </button>
                    <!-- Spartan Tile -->
                    <button id="tile-spartan" onclick="selectProgram('spartan')" class="relative p-4 rounded-2xl bg-slate-800 border-2 border-slate-700/50 flex flex-col items-start transition-all text-left opacity-60 hover:opacity-100">
                        <div class="w-8 h-8 rounded-full bg-red-500/20 flex items-center justify-center mb-2">
                            <i class="fa-solid fa-fire text-red-400 text-sm"></i>
                        </div>
                        <span class="text-white font-bold">Spartan</span>
                        <span class="text-slate-400 text-xs mt-1">Obstacle Prep</span>
                    </button>
                    <!-- 10K Prep Tile -->
                    <button id="tile-c210k" onclick="selectProgram('c210k')" class="relative p-4 rounded-2xl bg-slate-800 border-2 border-slate-700/50 flex flex-col items-start transition-all text-left opacity-60 hover:opacity-100">
                        <div class="w-8 h-8 rounded-full bg-sky-500/20 flex items-center justify-center mb-2">
                            <i class="fa-solid fa-shoe-prints text-sky-400 text-sm"></i>
                        </div>
                        <span class="text-white font-bold">10K Prep</span>
                        <span class="text-slate-400 text-xs mt-1">Week 4</span>
                    </button>
                </div>
            </section>

            <!-- Dynamic Preview Card -->
            <section id="preview-card" class="bg-gradient-to-br from-orange-900 to-slate-900 rounded-3xl p-6 border border-orange-500/30 shadow-lg transition-all">
                    <div class="flex justify-between items-start mb-2">
                        <span class="px-3 py-1 bg-white/10 rounded-full text-xs font-semibold text-white tracking-wide" id="preview-tag">CrossFit</span>
                    </div>
                    <h3 class="text-2xl font-bold text-white mt-2 leading-tight" id="preview-title">Pushjerk WOD</h3>
                    <p class="text-slate-300 text-sm mt-2 font-mono line-clamp-2" id="preview-desc">21-15-9 For Time</p>
                </section>
                
                <!-- Daily Quote Section -->
                <section class="mt-8 px-4 text-center pb-4">
                    <i class="fa-solid fa-quote-left text-slate-600 text-xl mb-2 opacity-50"></i>
                    <p id="daily-quote" class="text-slate-400 font-medium italic text-sm leading-relaxed">Loading motivation...</p>
                </section>

                <div class="h-12"></div> <!-- Spacer -->
            </div>

            <!-- Fixed Bottom Action Bar -->
            <div class="fixed bottom-0 w-full max-w-md bg-gradient-to-t from-slate-900 via-slate-900 to-transparent pt-12 pb-6 px-6">
                <button onclick="startWorkout()" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-blue-500/30 transition-all active:scale-95 flex items-center justify-center">
                    <i class="fa-solid fa-play mr-2"></i> Start Workout
                </button>
            </div>
        </div>

        <!-- ================= WORKOUT VIEW (Hidden by default) ================= -->
        <div id="view-workout" class="flex flex-col w-full h-full absolute top-0 left-0 bg-slate-900 translate-x-full transition-transform duration-300 z-20 pb-24 overflow-y-auto no-scrollbar">
            
            <header class="pt-12 pb-6 px-6 bg-slate-900 sticky top-0 z-30 border-b border-slate-800 flex items-center">
                <button onclick="endWorkout()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white mr-4">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div>
                    <h2 class="text-sm text-blue-400 font-bold tracking-wider uppercase" id="workout-header-tag">Pushjerk</h2>
                    <h1 class="text-2xl font-bold text-white" id="workout-header-title">Today's WOD</h1>
                </div>
            </header>

            <div class="px-6 pt-6" id="workout-context-container">
                <div class="bg-slate-800/80 rounded-2xl p-5 border border-slate-700/50 shadow-inner">
                    <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center">
                        <i class="fa-solid fa-clipboard-list text-blue-400 mr-2"></i> Workout Summary
                    </h3>
                    <div id="workout-desc-container" class="relative overflow-hidden max-h-32 transition-[max-height] duration-500 ease-in-out">
                        <p class="text-base text-slate-300 whitespace-pre-wrap leading-relaxed font-medium" id="workout-description">Loading summary...</p>
                        <div id="workout-desc-gradient" class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-slate-800/80 to-transparent"></div>
                    </div>
                    <button id="read-more-btn" onclick="toggleDescription()" class="text-blue-400 text-sm font-bold mt-3 w-full text-center py-2 bg-slate-900/50 rounded-lg active:scale-95 transition-all">Read More <i class="fa-solid fa-chevron-down ml-1"></i></button>
                </div>
            </div>

            <div class="px-6 py-6 space-y-4" id="exercise-list">
                <!-- Exercises injected here via JS -->
            </div>

            <!-- Fixed Bottom Action Bar for Workout -->
            <div class="fixed bottom-0 w-full max-w-md bg-gradient-to-t from-slate-900 via-slate-900 to-transparent pt-12 pb-6 px-6 z-30">
                <button id="finish-btn" onclick="finishWorkout()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold text-lg py-4 rounded-2xl shadow-lg shadow-emerald-500/30 transition-all active:scale-95 flex items-center justify-center">
                    <i class="fa-solid fa-check mr-2"></i> Finish & Log Data
                </button>
            </div>
        </div>

        <!-- Success Toast -->
        <div id="toast" class="absolute top-20 left-6 right-6 bg-emerald-500 text-white p-4 rounded-xl shadow-xl flex items-center space-x-3 hidden z-50">
            <i class="fa-solid fa-circle-check text-xl"></i>
            <div>
                <p class="font-bold">Awesome job!</p>
                <p class="text-sm opacity-90">Workout & weights logged.</p>
            </div>
        </div>
    </main>

    <script>
        // --- Configuration ---
        // PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbyT0OP8VvY-2TdnbYNy9k1CipzcEkC8o07sO6X-gi4442GMK5tJreYXt0pKkMNxU_xMWQ/exec";
        
        // --- State Management ---
        let currentProgram = 'pushjerk';
        let weightChartInstance = null;
        let realData = null; // Will hold the data fetched from the API

        document.addEventListener('DOMContentLoaded', () => {
            const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', dateOptions);
            
            // Initialize with an empty chart while loading
            initWeightChart([], []);
            
            // Fetch live data from Google Sheets API
            fetchAppData();
        });

        async function fetchAppData() {
            try {
                // Show loading state
                document.getElementById('weight-val').innerText = '...';
                document.getElementById('bmi-val').innerText = '...';
                document.getElementById('preview-desc').innerText = 'Loading today\'s plan...';

                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                realData = await response.json();
                
                // 1. Update Weight Dashboard
                if (realData.weightHistory && realData.weightHistory.length > 0) {
                    const latest = realData.weightHistory[realData.weightHistory.length - 1];
                    document.getElementById('weight-val').innerText = latest.weight ? latest.weight.toFixed(1) : '--';
                    document.getElementById('bmi-val').innerText = latest.bmi ? latest.bmi.toFixed(1) : '--';
                    
                    // Inject the Quote
                    if (latest.quote) {
                        document.getElementById('daily-quote').innerText = `"${latest.quote}"`;
                    } else {
                        document.getElementById('daily-quote').innerText = '"Nobody cares. Work harder."';
                    }
                    
                    // Update Chart
                    const labels = realData.weightHistory.map(d => d.date);
                    const dataPoints = realData.weightHistory.map(d => d.weight);
                    updateWeightChart(labels, dataPoints);
                } else {
                    document.getElementById('weight-val').innerText = '--';
                    document.getElementById('bmi-val').innerText = '--';
                }

                // 2. Select initial program to update UI
                selectProgram('pushjerk');

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('preview-desc').innerText = 'Error loading data. Check console.';
            }
        }

        function initWeightChart(labels, dataPoints) {
            const ctx = document.getElementById('weightChart').getContext('2d');
            
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = "'Inter', sans-serif";

            weightChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Weight (lbs)',
                        data: dataPoints,
                        borderColor: '#10b981', // emerald-500
                        backgroundColor: 'rgba(16, 185, 129, 0.15)',
                        borderWidth: 3,
                        pointBackgroundColor: '#0f172a',
                        pointBorderColor: '#10b981',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f8fafc',
                            bodyColor: '#f8fafc',
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + ' lbs';
                                }
                            }
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            display: false,
                            // If no data, set default bounds, otherwise dynamic
                            min: dataPoints.length ? Math.min(...dataPoints) - 1 : 150, 
                            max: dataPoints.length ? Math.max(...dataPoints) + 1 : 200
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                }
            });
        }

        function updateWeightChart(labels, dataPoints) {
            weightChartInstance.data.labels = labels;
            weightChartInstance.data.datasets[0].data = dataPoints;
            weightChartInstance.options.scales.y.min = Math.min(...dataPoints) - 1;
            weightChartInstance.options.scales.y.max = Math.max(...dataPoints) + 1;
            weightChartInstance.update();
        }

        // --- View Transitions & Rendering ---
        function selectProgram(program) {
            currentProgram = program;
            
            // Update UI Tiles
            const allPrograms = ['pushjerk', 'bodi', 'spartan', 'c210k'];
            allPrograms.forEach(prog => {
                const tile = document.getElementById('tile-' + prog);
                if(prog === program) {
                    tile.className = "relative p-4 rounded-2xl bg-slate-700 border-2 border-blue-500 flex flex-col items-start transition-all text-left shadow-lg shadow-blue-500/20 transform scale-[1.02]";
                } else {
                    tile.className = "relative p-4 rounded-2xl bg-slate-800 border-2 border-slate-700/50 flex flex-col items-start transition-all text-left opacity-60 hover:opacity-100";
                }
            });

            // Update Preview Card based on Live Data
            const card = document.getElementById('preview-card');
            
            // Default Themes
            const themes = {
                pushjerk: { theme: 'orange', tag: 'CrossFit', defaultTitle: 'Pushjerk WOD' },
                bodi: { theme: 'indigo', tag: 'BODi', defaultTitle: 'Scheduled Workout' },
                spartan: { theme: 'red', tag: 'Endurance', defaultTitle: 'Spartan Prep' },
                c210k: { theme: 'sky', tag: 'Running', defaultTitle: '10K Training' }
            };

            const t = themes[program];
            
            // Apply gradient based on theme
            if(t.theme === 'orange') {
                card.className = "bg-gradient-to-br from-orange-900 to-slate-900 rounded-3xl p-6 border border-orange-500/30 shadow-lg transition-all";
            } else if (t.theme === 'indigo') {
                card.className = "bg-gradient-to-br from-indigo-900 to-slate-900 rounded-3xl p-6 border border-indigo-500/30 shadow-lg transition-all";
            } else if (t.theme === 'red') {
                card.className = "bg-gradient-to-br from-red-900 to-slate-900 rounded-3xl p-6 border border-red-500/30 shadow-lg transition-all";
            } else if (t.theme === 'sky') {
                card.className = "bg-gradient-to-br from-sky-900 to-slate-900 rounded-3xl p-6 border border-sky-500/30 shadow-lg transition-all";
            }

            document.getElementById('preview-tag').innerText = t.tag;

            // Check if we have real data for this program
            if (realData && realData.workouts && realData.workouts[program]) {
                const progData = realData.workouts[program];
                document.getElementById('preview-title').innerText = progData.title;
                
                let descText = "";
                if (Array.isArray(progData.exercises)) {
                    descText = `${progData.exercises.length} movements detected.`;
                } else if (progData.exercises.description) {
                    // Remove manual JS truncation, let CSS line-clamp handle it cleanly
                    descText = progData.exercises.description;
                } else {
                    descText = "No description available.";
                }
                
                document.getElementById('preview-desc').innerText = descText;
            } else {
                // Fallback if no data found for today
                document.getElementById('preview-title').innerText = t.defaultTitle;
                document.getElementById('preview-desc').innerText = "No workout data found for today.";
            }
        }

        function startWorkout() {
            // Check if data exists before starting
            if (!realData || !realData.workouts || !realData.workouts[currentProgram]) {
                alert("No workout data available to start.");
                return;
            }

            const data = realData.workouts[currentProgram];
            const tag = document.getElementById('preview-tag').innerText;
            
            // Setup Workout Header
            document.getElementById('workout-header-tag').innerText = tag;
            document.getElementById('workout-header-title').innerText = data.title;

            // Handle the new Payload structure (Object instead of Array)
            let exList = [];
            let descText = "";
            
            if (Array.isArray(data.exercises)) {
                exList = data.exercises;
                descText = "Workout summary not available for this older entry.";
            } else {
                exList = data.exercises.exercises || [];
                descText = data.exercises.description || "No description provided.";
            }
            
            // Set the workout context text in the UI
            document.getElementById('workout-description').innerText = descText;

            // Handle Read More Toggle Reset
            const descContainer = document.getElementById('workout-desc-container');
            const descGradient = document.getElementById('workout-desc-gradient');
            const readMoreBtn = document.getElementById('read-more-btn');
            
            descContainer.classList.add('max-h-32');
            descContainer.classList.remove('max-h-[2000px]');
            descGradient.classList.remove('hidden');
            readMoreBtn.innerHTML = 'Read More <i class="fa-solid fa-chevron-down ml-1"></i>';
            
            // Hide the button entirely if the text is short
            setTimeout(() => {
                const textHeight = document.getElementById('workout-description').offsetHeight;
                if (textHeight <= 128) {
                    readMoreBtn.classList.add('hidden');
                    descGradient.classList.add('hidden');
                } else {
                    readMoreBtn.classList.remove('hidden');
                    descGradient.classList.remove('hidden');
                }
            }, 50);

            // Build Exercise List dynamically
            const list = document.getElementById('exercise-list');
            list.innerHTML = ''; 

            exList.forEach((ex, index) => {
                // Determine Trend Icon
                let trendHtml = '';
                if(ex.trend === 'up') trendHtml = `<i class="fa-solid fa-arrow-trend-up text-emerald-400"></i>`;
                else if(ex.trend === 'down') trendHtml = `<i class="fa-solid fa-arrow-trend-down text-red-400"></i>`;
                else trendHtml = `<i class="fa-solid fa-minus text-slate-500"></i>`;

                const exCard = `
                    <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700/50 exercise-card" data-ex-name="${ex.name}">
                        <div class="flex justify-between items-start mb-3">
                            <h4 class="text-lg font-bold text-slate-200">${index + 1}. ${ex.name}</h4>
                            <div class="flex flex-col items-end">
                                <span class="text-xs text-slate-400 font-medium mb-1">Previous</span>
                                <div class="flex items-center space-x-2 bg-slate-900 px-2 py-1 rounded text-sm text-slate-300">
                                    <span>${ex.historyWeight} x ${ex.historyReps}</span>
                                    ${trendHtml}
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mt-4">
                            <div>
                                <label class="text-xs text-slate-400 mb-1 block pl-1">Weight (lbs)</label>
                                <input type="text" placeholder="e.g. 40" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all ex-weight-input">
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 mb-1 block pl-1">Reps</label>
                                <input type="number" placeholder="e.g. 10" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all ex-reps-input">
                            </div>
                        </div>
                    </div>
                `;
                list.innerHTML += exCard;
            });

            // Slide in the workout view
        document.getElementById('view-workout').classList.remove('translate-x-full');
    }

    function toggleDescription() {
        const container = document.getElementById('workout-desc-container');
        const gradient = document.getElementById('workout-desc-gradient');
        const btn = document.getElementById('read-more-btn');
        
        if (container.classList.contains('max-h-32')) {
            // Expand
            container.classList.remove('max-h-32');
            container.classList.add('max-h-[2000px]');
            gradient.classList.add('hidden');
            btn.innerHTML = 'Show Less <i class="fa-solid fa-chevron-up ml-1"></i>';
        } else {
            // Collapse
            container.classList.add('max-h-32');
            container.classList.remove('max-h-[2000px]');
            gradient.classList.remove('hidden');
            btn.innerHTML = 'Read More <i class="fa-solid fa-chevron-down ml-1"></i>';
        }
    }

    function endWorkout() {
        document.getElementById('view-workout').classList.add('translate-x-full');
    }

        function endWorkout() {
            document.getElementById('view-workout').classList.add('translate-x-full');
        }

        async function finishWorkout() {
            const btn = document.getElementById('finish-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...';
            
            // Gather data from the DOM
            const payload = {
                program: currentProgram,
                exercises: []
            };

            const cards = document.querySelectorAll('.exercise-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-ex-name');
                const weight = card.querySelector('.ex-weight-input').value;
                const reps = card.querySelector('.ex-reps-input').value;
                
                // Only save if they entered something
                if (weight || reps) {
                    payload.exercises.push({
                        name: name,
                        weight: weight || "0",
                        reps: reps || "0"
                    });
                }
            });

            // If nothing was logged, just exit
            if (payload.exercises.length === 0) {
                alert("Please log at least one movement before finishing.");
                btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Finish & Log Data';
                return;
            }

            try {
                // Send POST request to Google Apps Script API
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8', // GAS requires text/plain for CORS
                    }
                });

                const result = await response.json();
                
                if (result.status === "success") {
                    btn.innerHTML = '<i class="fa-solid fa-check-double mr-2"></i> Logged';
                    btn.classList.replace('bg-emerald-500', 'bg-slate-800');
                    btn.classList.add('text-emerald-500', 'border', 'border-emerald-500/30');
                    
                    showToast();

                    setTimeout(() => {
                        endWorkout();
                        // Reset button
                        btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Finish & Log Data';
                        btn.classList.replace('bg-slate-800', 'bg-emerald-500');
                        btn.classList.remove('text-emerald-500', 'border', 'border-emerald-500/30');
                    }, 1500);
                } else {
                    alert("Error saving workout: " + result.message);
                    btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Finish & Log Data';
                }

            } catch (error) {
                console.error("Error saving data:", error);
                alert("Failed to save workout. Check connection.");
                btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Finish & Log Data';
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            toast.classList.add('animate-slide-up');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('animate-slide-up');
            }, 3000);
        }
    </script>
</body>
</html>
